name: Build APK

on:
  push:
    branches: [ "claude/japanese-learning-app-4p1tP", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Debug environment
        run: |
          echo "=== Gradle ===" && (gradle --version 2>/dev/null || echo "no gradle")
          echo "=== ANDROID_HOME ===" && echo "$ANDROID_HOME"
          echo "=== SDK contents ===" && ls "$ANDROID_HOME" 2>/dev/null || echo "empty"
          echo "=== Java ===" && java -version

      - name: Generate correct gradle-wrapper.jar
        run: |
          mkdir -p /tmp/wp
          echo '' > /tmp/wp/build.gradle
          echo 'rootProject.name = "tmp"' > /tmp/wp/settings.gradle
          cd /tmp/wp && gradle wrapper --gradle-version 8.2 --stacktrace
          cp /tmp/wp/gradle/wrapper/gradle-wrapper.jar $GITHUB_WORKSPACE/gradle/wrapper/
          echo "wrapper jar size: $(wc -c < $GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -60

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nihongo-beginner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
