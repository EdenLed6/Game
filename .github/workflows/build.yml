name: Building APK

on:
  push:
    branches:
      - main
      - work
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon clean :app:assembleDebug :app:packageDebug --stacktrace

      - name: Inspect APK outputs
        if: always()
        run: |
          echo "=== app/build/outputs ==="
          ls -la app/build/outputs || true
          echo "=== APK files ==="
          find app/build -type f -name "*.apk" -print -exec ls -lh {} \; || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload app build directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-dir
          path: app/build
