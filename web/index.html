<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- Force the browser AND any installed PWA to refetch index.html on
       every launch instead of serving stale cached HTML — without this
       the PWA can keep linking to a previous override-* CSS file long
       after a deploy. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#8A1F16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kimura" />
  <title>Kimura — יפנית למתחילים</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/kimura_logo_red.png" />
  <link rel="apple-touch-icon" href="assets/kimura_logo_red.png" />

  <link rel="preload" as="image" href="assets/bg_japanese.png" />
  <link rel="preload" as="image" href="assets/bg_header.png" />

  <!-- ?v=20260429zd busts the GitHub Pages CDN's 10-minute cache for CSS
       and JS so users see new builds without waiting for the TTL. Bump
       this query string on every meaningful UI change. -->
  <link rel="stylesheet" href="css/tokens.css?v=20260429zd" />
  <link rel="stylesheet" href="css/base.css?v=20260429zd" />
  <link rel="stylesheet" href="css/components.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/learn.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/media.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/profile.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/lesson-journey.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/journey-step.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/journey-intro.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/journey-teach.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/journey-vocab.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/journey-practice.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/journey-quiz.css?v=20260429zd" />
  <link rel="stylesheet" href="css/screens/journey-complete.css?v=20260429zd" />

  <!-- Emergency override sheet — fresh path, no cache history. Loaded last
       so its rules win. Bump the filename when content changes so the
       browser fetches it instead of serving its cached previous content. -->
  <link rel="stylesheet" href="css/override-20260429zd.css" />
</head>
<body>

  <!-- A02820 copyright bar — exact line from activity_main.xml -->
  <div class="copyright-bar">© קימורה בית הספר לשפה היפנית</div>

  <!-- Build verification stamp. The build version (`s` here) updates
       on every meaningful UI deploy; if the badge in the bottom-left
       corner shows the latest letter, the user is on the latest build.
       If it shows an older letter, the PWA / browser is still serving
       a cached HTML and won't reflect any new CSS until that resolves. -->
  <div id="build-stamp" style="position:fixed;right:4px;top:4px;z-index:9999;
       font:9px/1 monospace;color:rgba(255,255,255,0.5);pointer-events:none;
       background:rgba(0,0,0,0.25);padding:2px 5px;border-radius:4px;">
    build zd
  </div>

  <!-- Fragment container — current screen mounts here -->
  <main id="screen-host" class="screen-host" role="main"></main>

  <!-- 2dp red rule above the bottom nav -->
  <div class="bottom-nav-divider"></div>

  <!-- BottomNavigationView port (3 tabs, 96dp tall, 64dp icons) -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="ניווט ראשי"></nav>

  <script type="module" src="js/main.js?v=20260429zd"></script>
</body>
</html>
