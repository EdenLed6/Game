  <link rel="stylesheet" href="css/override-20260429f.css" />

<body>

  <!-- A02820 copyright bar — exact line from activity_main.xml -->
  <div class="copyright-bar">© קימורה בית הספר לשפה היפנית</div>

  <!-- TEMPORARY DEPLOY-VERIFY BANNER. If the user can see this magenta strip
       below the copyright bar, the latest build IS reaching her phone and
       the size complaint is purely a CSS-tuning question. If she doesn't
       see it, the GitHub Pages workflow isn't deploying our changes at all
       and we need to debug the pipeline rather than the styles. Will be
       removed once the size issue is resolved. -->

  <!-- Fragment container — current screen mounts here -->
  <main id="screen-host" class="screen-host" role="main"></main>

  <!-- 2dp red rule above the bottom nav -->
  <div class="bottom-nav-divider"></div>

  <!-- BottomNavigationView port (3 tabs, 96dp tall, 64dp icons) -->
