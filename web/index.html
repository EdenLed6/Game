<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- Force the browser AND any installed PWA to refetch index.html
       on every launch instead of serving stale cached HTML. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#8C2A1F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kimura" />
  <title>קימורה · יפנית למתחילים</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/kimura_logo_red.png" />
  <link rel="apple-touch-icon" href="assets/kimura_logo_red.png" />

  <link rel="preload" as="image" href="assets/bg_japanese.png" />
  <link rel="preload" as="image" href="assets/bg_header.png" />

  <!-- Typography from Claude Design Kimura.html. Frank Ruhl Libre +
       Heebo (Hebrew), Noto Serif/Sans JP (Japanese), Cormorant
       Garamond (italic Latin subtitles in lesson nodes). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700;800&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet" />

  <!-- Capture beforeinstallprompt as early as possible so the install
       button can fire it whenever the user taps. Chrome/Edge/Samsung
       Internet on Android dispatch this once the site is installable;
       iOS Safari never does, so the install button falls back to
       step-by-step instructions. -->
  <script>
    window.__pwaPrompt = null;
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      window.__pwaPrompt = e;
    });
    window.addEventListener("appinstalled", function() {
      window.__pwaPrompt = null;
    });
  </script>

  <link rel="stylesheet" href="css/design-styles.css?v=20260503-design2" />
</head>
<body>

  <!-- A02820 copyright bar — preserved from prior version -->
  <div class="copyright-bar">© קימורה בית הספר לשפה היפנית</div>

  <!-- PWA install button — visible only in non-PWA browsers
       (display:none inside standalone via CSS). Always visible in
       the regular web (per user). -->
  <button id="pwa-install-btn" class="pwa-install-btn" type="button">
    <span class="pwa-install-btn__icon" aria-hidden="true">📲</span>
    <span class="pwa-install-btn__text">התקן את האפליקציה</span>
  </button>

  <!-- React mount point — the design's app.jsx renders here -->
  <div id="root"></div>

  <!-- React + Babel from CDN (the design uses on-the-fly JSX
       compilation; we keep that to match the bundle exactly). -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Design app — JS+JSX from untitled/project/design_handoff_kimura_redesign/.
       Loaded in the same order as the design's Kimura.html. -->
  <script src="js/design/data.js?v=20260503-design2"></script>
  <script type="text/babel" src="js/design/icons.jsx?v=20260503-design2"></script>
  <script type="text/babel" src="js/design/shell.jsx?v=20260503-design2"></script>
  <script type="text/babel" src="js/design/screen-home.jsx?v=20260503-design2"></script>
  <script type="text/babel" src="js/design/screen-lesson.jsx?v=20260503-design2"></script>
  <script type="text/babel" src="js/design/screen-profile-media.jsx?v=20260503-design2"></script>
  <script type="text/babel" src="js/design/tweaks-panel.jsx?v=20260503-design2"></script>
  <script type="text/babel" src="js/design/app.jsx?v=20260503-design2"></script>

  <!-- PWA shell (service worker + install button + iOS detection +
       cache cleanup) -->
  <script>
    (async function pwaBoot() {
      // Service worker — register pass-through SW and clean up legacy
      // SWs from previous app versions.
      if ("serviceWorker" in navigator) {
        try {
          var ourSwUrl = new URL("sw.js", location.href).href;
          var regs = await navigator.serviceWorker.getRegistrations();
          for (var i = 0; i < regs.length; i++) {
            var reg = regs[i];
            var swObj = reg.active || reg.waiting || reg.installing;
            var swUrl = swObj ? swObj.scriptURL : "";
            if (swUrl && !swUrl.startsWith(ourSwUrl)) {
              try { await reg.unregister(); } catch (e) {}
            }
          }
          try { await navigator.serviceWorker.register("sw.js"); } catch (e) {}
        } catch (e) {}
      }

      // Disable pinch-zoom + double-tap-zoom (PWA polish).
      document.addEventListener("gesturestart", function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gesturechange", function(e) { e.preventDefault(); }, { passive: false });
      document.addEventListener("gestureend", function(e) { e.preventDefault(); }, { passive: false });
      var lastTap = 0;
      document.addEventListener("touchend", function(e) {
        var now = Date.now();
        if (now - lastTap < 350) e.preventDefault();
        lastTap = now;
      }, { passive: false });
      document.addEventListener("wheel", function(e) {
        if (e.ctrlKey) e.preventDefault();
      }, { passive: false });

      // Install button — always visible in non-PWA browsers.
      var btn = document.getElementById("pwa-install-btn");
      if (!btn) return;
      var ua = navigator.userAgent;
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                  (ua.indexOf("Mac") !== -1 && navigator.maxTouchPoints > 1);
      var isIOSChrome = /CriOS/.test(ua);
      var isIOSFirefox = /FxiOS/.test(ua);
      var isIOSEdge = /EdgiOS/.test(ua);
      var isIOSNonSafari = isIOS && (isIOSChrome || isIOSFirefox || isIOSEdge);

      function showManualInstructions() {
        if (isIOSNonSafari) {
          alert(
            "באייפון אפשר להתקין את האפליקציה רק דרך Safari.\n\n" +
            "כדי להתקין:\n" +
            "1. פתחו את האתר ב־Safari\n" +
            "2. לחצו על כפתור השיתוף בתחתית הדפדפן\n" +
            "3. גללו ובחרו “הוסף למסך הבית”\n" +
            "4. לחצו “הוסף”"
          );
        } else if (isIOS) {
          alert(
            "כדי להתקין את האפליקציה:\n" +
            "1. לחצו על כפתור השיתוף ⬆ בתחתית הדפדפן\n" +
            "2. גללו ובחרו “הוסף למסך הבית”\n" +
            "3. לחצו “הוסף”"
          );
        } else {
          alert(
            "כדי להתקין את האפליקציה:\n" +
            "1. לחצו על תפריט הדפדפן (⋮ בפינה)\n" +
            "2. בחרו “התקן אפליקציה” או “הוסף למסך הבית”\n" +
            "3. אשרו את ההתקנה"
          );
        }
      }

      btn.addEventListener("click", async function() {
        if (!isIOS && window.__pwaPrompt) {
          try {
            window.__pwaPrompt.prompt();
            await window.__pwaPrompt.userChoice;
          } catch (e) {}
          window.__pwaPrompt = null;
          return;
        }
        showManualInstructions();
      });
    })();
  </script>
</body>
</html>
