<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <!-- Force the browser AND any installed PWA to refetch index.html on
       every launch instead of serving stale cached HTML — without this
       the PWA can keep linking to a previous override-* CSS file long
       after a deploy. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="theme-color" content="#8A1F16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kimura" />
  <title>Kimura — יפנית למתחילים</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/kimura_logo_red.png" />
  <link rel="apple-touch-icon" href="assets/kimura_logo_red.png" />

  <link rel="preload" as="image" href="assets/bg_japanese.png" />
  <link rel="preload" as="image" href="assets/bg_header.png" />

  <!-- Typography from Claude Design Kimura.html handoff. Frank Ruhl
       Libre carries the page titles in Hebrew (more elegant than the
       default sans), Heebo handles UI text. Noto Serif/Sans JP cover
       Japanese script. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@300;400;500;600;700;800&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- ?v=20260503-design busts the GitHub Pages CDN's 10-minute cache for CSS
       and JS so users see new builds without waiting for the TTL. Bump
       this query string on every meaningful UI change. -->
  <link rel="stylesheet" href="css/tokens.css?v=20260503-design" />
  <link rel="stylesheet" href="css/base.css?v=20260503-design" />
  <link rel="stylesheet" href="css/components.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/learn.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/media.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/profile.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/lesson-journey.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/journey-step.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/journey-intro.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/journey-teach.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/journey-vocab.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/journey-practice.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/journey-quiz.css?v=20260503-design" />
  <link rel="stylesheet" href="css/screens/journey-complete.css?v=20260503-design" />

  <!-- Emergency override sheet — fresh path, no cache history. Loaded last
       so its rules win. Bump the filename when content changes so the
       browser fetches it instead of serving its cached previous content. -->
  <link rel="stylesheet" href="css/override-20260503-design.css" />

  <!-- Capture `beforeinstallprompt` AS EARLY AS POSSIBLE. The browser
       fires this event when the site is installable (incl. after a
       user uninstalls and revisits). It can fire BEFORE main.js loads,
       and once an unhandled event is dispatched, the prompt is lost.
       Stash it on window so main.js can pick it up regardless of when
       it loads. Same for `appinstalled`. -->
  <script>
    window.__pwaPrompt = null;
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      window.__pwaPrompt = e;
    });
    window.addEventListener("appinstalled", function() {
      // After install: any stored prompt is consumed. Clear so the next
      // beforeinstallprompt (e.g. after uninstall) is the one we use.
      window.__pwaPrompt = null;
    });
  </script>
</head>
<body>

  <!-- A02820 copyright bar — exact line from activity_main.xml -->
  <div class="copyright-bar">© קימורה בית הספר לשפה היפנית</div>

  <!-- PWA install button — always shown in the regular web browser
       (per user: לא להעלים אותו בכלל), hidden only inside the
       installed PWA via the @media (display-mode: standalone) rule
       in CSS. No dismiss / no auto-hide / no localStorage flags. -->
  <button id="pwa-install-btn" class="pwa-install-btn" type="button">
    <span class="pwa-install-btn__icon" aria-hidden="true">📲</span>
    <span class="pwa-install-btn__text">התקן את האפליקציה</span>
  </button>

  <!-- Build verification stamp removed in zx (no longer needed; cache-
       busting via override file rename has been reliable). -->


  <!-- Fragment container — current screen mounts here -->
  <main id="screen-host" class="screen-host" role="main"></main>

  <!-- 2dp red rule above the bottom nav -->
  <div class="bottom-nav-divider"></div>

  <!-- BottomNavigationView port (3 tabs, 96dp tall, 64dp icons) -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="ניווט ראשי"></nav>

  <script type="module" src="js/main.js?v=20260503-design"></script>
</body>
</html>
